<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag button</title>
    <style>
        .btn1{
            background-color: black;
            color: #fff;
            width: 150px;
            height: 40px;
            border: 3px solid #0a0;
            border-radius: 15px;

            &:hover{
                background-color: #fff;
                color: black;
                border-color: black;
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <!-- submit reset e button -->
    <button class="btn1" type="button" form="f_cadastro" onclick="alert('CFB Cursos')">CFB Cursos</button>
</body>
</html>
