<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script>
        function desenhar() {
            var canvas = document.getElementById("telaDesenho");
            let ctx =canvas.getContext("2d");
            ctx.fillRect(25,25,100,100)
        }
    </script>
</head>
<body>
    <canvas id="telaDesenho" width="500px" height="500px" style="border:1px solid black">
        Seu browser não suporta o elemento canvas
    </canvas>
    <script>
        desenhar()
    </script>
</body>
</html>
