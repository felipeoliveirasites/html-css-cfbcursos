<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário P11 (fieldset)</title>
</head>
     <style>
      
        input{ }
        .quebra{
            display: block;
        }
        .espaco{
            margin-bottom: 15px;
        }
        .espaco_t{
            margin-top: 15px;
        }
        form{
            border: 1px solid black;
            padding: 10px;
            border-radius: 15px;
            background-color: #eee;
        }

        #dv_btns{
            display: flex;
        }
    </style>
</head>
<body>
     <form action="#" name="f_cadastro" method="get" >

        <textarea name="f_comentario" cols="50" rows="10" id="" 
        autofocus>CFB cursos</textarea>
        <br>
      <input class="espaco_t quebra" type="submit" value="Enviar" name="f_enviar">

    </form>
</body>
</html>
