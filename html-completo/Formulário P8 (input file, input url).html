<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário P8 (input file, input url)</title>
         <style>
      
        input{ }
        .quebra{
            display: block;
        }
        .espaco{
            margin-bottom: 15px;
        }
        .espaco_t{
            margin-top: 15px;
        }
        form{
            border: 1px solid black;
            padding: 10px;
            border-radius: 15px;
            background-color: #eee;
        }

        #dv_btns{
            display: flex;
        }
    </style>
</head>
<body>
     <form action="#" name="f_cadastro" method="get" enctype="multipart/form-data" >

      <label for="">Selecione o arquivo</label>
      <input class="quebra" type="file" name="f_arquivo" multiple accept=".jpg,.gif,.png">
       <label for="">Digite o URL:</label>
      <input class="quebra" type="url" name="f_url" >

      <input class="espaco_t quebra" type="submit" value="Enviar" name="f_enviar">

    </form>
</body>
</html>
