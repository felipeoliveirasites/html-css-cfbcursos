<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
      
        input{ }
        .quebra{
            display: block;
        }
        .espaco{
            margin-bottom: 15px;
        }
        .espaco_t{
            margin-top: 15px;
        }
        form{
            border: 1px solid black;
            padding: 10px;
            border-radius: 15px;
            background-color: #eee;
        }

        #dv_btns{
            display: flex;
        }
    </style>
</head>
<body>
    <form action="#" name="f_cadastro" method="get" enctype="">
      <label for="">Hora:</label>
      <input class="quebra" type="time" name="f_hora" min="09:00" max="17:00" >
      <label class="quebra espaco_t" for="">Data:</label>
      <input type="date" name="f_data" min="2026-06-25" max="2026-06-28">

      <label class="quebra espaco_t" for="">Data e hora:</label>
      <input type="datetime-local" name="f_data_hora" id="">

      <input class="espaco_t quebra" type="submit" value="Enviar" name="f_enviar">
    </form>
</body>
</html>
