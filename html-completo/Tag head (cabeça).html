<head>
    <!-- 1. Codificação de Caracteres (SEMPRE no topo) -->
    <meta charset="UTF-8">

    <!-- 2. Configuração de Tela / Celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. Título e Descrição para o Google (SEO) -->
    <title>Dr. João Silva | Lentes de Contato e Estética Dental</title>
    <meta name="description" content="Transforme seu sorriso com lentes de contato dentais de alta precisão. Agende sua avaliação VIP no Jardins.">

    <!-- 4. Preload de Recursos Críticos (Suas fontes locais .woff2) -->
    <link rel="preload" href="/fonts/raleway-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- 5. Folha de Estilo Principal -->
    <link rel="stylesheet" href="style.css">

    <!-- 6. Favicon (Ícone da Aba) -->
    <link rel="icon" href="/favicon.ico">

  <!-- Tags Open Graph para WhatsApp, Instagram e Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://drjoaosilva.com.br/">
<meta property="og:title" content="Dr. João Silva | Lentes de Contato Dentais em SP">
<meta property="og:description" content="Transforme seu sorriso com lentes de porcelana de alta precisão. Agende sua avaliação VIP no Jardins.">

<!-- A Imagem de Prévia (O segredo do alto padrão) -->
<meta property="og:image" content="https://drjoaosilva.com.br/assets/og-whatsapp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
</head>

</body>
