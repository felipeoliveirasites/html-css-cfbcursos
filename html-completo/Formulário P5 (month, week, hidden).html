<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
      
        input{ }
        .quebra{
            display: block;
        }
        .espaco{
            margin-bottom: 15px;
        }
        .espaco_t{
            margin-top: 15px;
        }
        form{
            border: 1px solid black;
            padding: 10px;
            border-radius: 15px;
            background-color: #eee;
        }

        #dv_btns{
            display: flex;
        }
    </style>
</head>
<body>
    <form action="#" name="f_cadastro" method="get" enctype="">

      <label for="">Mes:</label>
      <input class="quebra" type="month" name="f_mess" >

      <label class="quebra espaco_t" for="">Semana:</label>
      <input type="week" name="f_sem">

      <input type="hidden" name="canal" value="CFBcurso">
      <input type="hidden" name="curso" value="HTML5">

      <input class="espaco_t quebra" type="submit" value="Enviar" name="f_enviar">

    </form>
</body>
</html>
