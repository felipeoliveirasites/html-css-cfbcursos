<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário P7 (input input tel, number, search)</title>
   
     <style>
      
        input{ }
        .quebra{
            display: block;
        }
        .espaco{
            margin-bottom: 15px;
        }
        .espaco_t{
            margin-top: 15px;
        }
        form{
            border: 1px solid black;
            padding: 10px;
            border-radius: 15px;
            background-color: #eee;
        }

        #dv_btns{
            display: flex;
        }
    </style>
</head>
<body>
     <form action="#" name="f_cadastro" method="get" enctype="">

      <label for="">>
      <input class="quebra" type="tel" name="f_tel" pattern="\([0-9]{2}\)[9]{1}[0-9]{4}-[0-9]{4}" placeholder="(xx)9xxxx-xxxx">

       <label for="">Senha: </label>
      <input class="quebra" type="password" name="f_senha" pattern="[a-zA-Z0-9]{5}" placeholder="">

      <label class="quebra espaco_t" for="">Escolha um numero</label>
      <input type="number" name="f_number" step="2" min="0" max="10">

      <label class="quebra espaco_t" for="">Pesquisa</label>
      <input type="search" name="f_pesquisa" >

      <input class="espaco_t quebra" type="submit" value="Enviar" name="f_enviar">

    </form>
</body>
</html>
