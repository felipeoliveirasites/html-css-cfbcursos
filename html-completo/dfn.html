<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso correto de dfn e abbr</title>
    <style>
        /* Dica de sênior: Estilizar o abbr para o usuário saber que dá para passar o mouse */
        abbr {
            text-decoration: underline dotted #0a0; /* Linha pontilhada verde embaixo */
            cursor: help; /* Cursor com interrogação ao passar o mouse */
        }
    </style>
</head>
<body>

    <p>O <dfn><abbr title="Hypertext Markup Language">HTML</abbr></dfn> é uma linguagem de marcação utilizada para estruturar páginas web.</p>

    <p>O <dfn><abbr title="Cascading Style Sheets">CSS</abbr></dfn> é um recurso utilizado para adicionar estilos e layouts em páginas web.</p>
    
</body>
</html>
